<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard · GuessWord</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/admin"><span class="brand-mark">G</span><span>Guess<span class="brand-accent">Word</span></span></a>
      <button id="logoutButton" class="button ghost" type="button">Sign out</button>
    </header>
    <section id="adminDashboard">
      <p class="eyebrow">Administrator dashboard</p>
      <h1 class="dashboard-title">Application stats</h1>
      <p id="who" class="muted">Loading your report...</p>
      <div id="adminSummary" class="stats-grid"></div>
      <div class="admin-tables">
        <section class="card report-card"><div class="section-heading"><h2>Daily activity</h2></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Users</th><th>Words tried</th><th>Correct guesses</th></tr></thead><tbody id="dailyRows"></tbody></table></div></section>
        <section class="card report-card"><div class="section-heading"><h2>Per-user activity</h2></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Date</th><th>Words tried</th><th>Correct guesses</th></tr></thead><tbody id="userRows"></tbody></table></div></section>
        <section class="card report-card"><div class="section-heading"><h2>Per-word performance</h2></div><div class="table-wrap"><table><thead><tr><th>Secret word</th><th>Matches</th><th>Guesses</th><th>Wins</th><th>Losses</th><th>Win rate</th></tr></thead><tbody id="wordRows"></tbody></table></div></section>
      </div>
      <p id="adminResult" class="message" role="alert"></p>
    </section>
  </main>
  <script src="/static/app.js?v=4"></script>
</body>
</html>
